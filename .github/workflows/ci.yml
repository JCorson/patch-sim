name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group=dev --group=ui

      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Type check
        run: uvx ty check

      - name: Unit tests
        run: uv run --frozen -m pytest tests/unit --verbose

      - name: Integration tests
        run: uv run --frozen -m pytest tests/integration --verbose

      - name: UI tests
        run: uv run --frozen -m pytest tests/ui --verbose
