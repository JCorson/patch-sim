name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv run ci.py install

      - name: Lint
        run: uv run ci.py lint

      - name: Type check
        run: uv run ci.py typecheck

      - name: Test
        run: uv run ci.py test
