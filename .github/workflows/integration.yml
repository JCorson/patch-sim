name: Integration tests

# Integration tests exercise full simulations for every neuron preset, so they
# burn a lot of Actions minutes. Run them weekly (and on demand) rather than on
# every push/PR; we still run them locally before merging.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group=dev --group=ui

      - name: Run integration tests
        run: uv run --frozen -m pytest tests/integration --verbose
