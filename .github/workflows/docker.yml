name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - uv.lock
      - .python-version
      - rxconfig.py
      - patch_sim/**
      - patch_sim_ui/**
      - assets/**
      - tools/capture_screenshots.py
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - uv.lock
      - .python-version
      - rxconfig.py
      - patch_sim/**
      - patch_sim_ui/**
      - assets/**
      - tools/capture_screenshots.py
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: patch-sim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name patch-sim -p 3000:3000 patch-sim:ci

      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:3000/ping; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' patch-sim)" != true ]; then
              echo "Container exited before the app came up"
              exit 1
            fi
            sleep 5
          done
          echo "App did not respond within 5 minutes"
          exit 1

      - name: Smoke-test HTTP routes
        run: |
          curl -fsS --max-time 10 http://localhost:3000/ | grep -qi '<html'
          curl -fsS --max-time 10 -o /dev/null http://localhost:3000/help
          curl -fsS --max-time 10 -o /dev/null http://localhost:3000/screenshots/overview.png

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run a simulation end to end in a browser
        run: |
          uv sync --frozen --no-dev --group=screenshots
          uv run --frozen --no-sync playwright install --with-deps chromium
          PATCH_SIM_URL=http://localhost:3000 uv run --frozen --no-sync python tools/capture_screenshots.py

      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-screenshots
          path: assets/screenshots/
          if-no-files-found: ignore

      - name: Container logs
        if: always()
        run: docker logs patch-sim
