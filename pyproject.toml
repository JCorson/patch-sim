[project]
name = "patch_sim"
version = "0.1.0"
description = "Patch clamp experiment simulator implementing the Hodgkin-Huxley model for neuronal electrophysiology"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.optional-dependencies]
numba = [
    "numba",
]

[tool.uv.sources]
patch_sim = {path = "./patch_sim", editable = true}

[tool.ty.src]
include = ["./patch_sim", "./patch_sim_ui", "./tests"]

[[tool.ty.overrides]]
include = ["patch_sim_ui/**", "tests/test_state.py", "tests/test_plotting.py"]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["reflex.**", "plotly.**", "patch_sim_ui.**"]

# numba is not typed; suppress all errors in the JIT kernel module.
[[tool.ty.overrides]]
include = ["patch_sim/numba_kernel.py"]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["numba.**"]

# NumPy structured arrays use string-key subscript assignment which ty does not
# model. Suppress the false-positive invalid-assignment errors in files that
# build or read structured arrays.
[[tool.ty.overrides]]
include = [
    "patch_sim/clamp_simulations.py",
    "tests/test_plotting.py",
    "tests/test_state.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=7.0.0",
    "ruff>=0.1",
]
ui = [
    "plotly>=5",
    "reflex>=0.8",
]
