[project]
name = "ap_sim"
version = "0.1.0"
description = "Action potential simulator implementing the Hodgkin-Huxley model for neuronal electrophysiology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.optional-dependencies]
dev = ["ruff", "pytest", "mypy", "pandas-stubs"]
ui = ["reflex>=0.8", "plotly"]

[tool.uv.sources]
ap_sim = {path = "./ap_sim", editable = true}

[tool.mypy]

[[tool.mypy.overrides]]
module = ["ap_sim_ui.*", "reflex.*", "plotly.*", "rxconfig"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]