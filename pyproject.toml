[project]
name = "patch_sim"
version = "0.1.0"
description = "Patch clamp experiment simulator implementing the Hodgkin-Huxley model for neuronal electrophysiology"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
patch_sim = {path = "./patch_sim", editable = true}

[tool.mypy]
exclude = ["scratch/"]

[[tool.mypy.overrides]]
# test_state.py uses Reflex internals (_reflex_internal_init) and accesses
# dynamically-generated AppState attributes (set_duration, set_show_voltage,
# etc.) that mypy cannot resolve from the class definition alone.
# test_plotting.py imports plotly directly; plotly has no type stubs.
module = [
    "patch_sim_ui.*",
    "reflex.*",
    "plotly.*",
    "rxconfig",
    "tests.test_state",
    "tests.test_plotting",
    ]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=7",
    "pytest-cov>=7.0.0",
    "ruff>=0.1",
]
ui = [
    "plotly>=5",
    "reflex>=0.8",
]
