[project]
name = "ap_sim"
version = "0.1.0"
description = "Action potential simulator implementing the Hodgkin-Huxley model for neuronal electrophysiology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.optional-dependencies]
dev = ["ruff", "pytest", "mypy", "pandas-stubs"]
ui = ["reflex>=0.8", "plotly"]

[tool.uv.sources]
ap_sim = {path = "./ap_sim", editable = true}

[tool.mypy]

[[tool.mypy.overrides]]
module = ["ap_sim_ui.*", "reflex.*", "plotly.*", "rxconfig"]
ignore_errors = true

[[tool.mypy.overrides]]
# test_state.py uses Reflex internals (_reflex_internal_init) and accesses
# dynamically-generated AppState attributes (set_duration, set_show_voltage,
# etc.) that mypy cannot resolve from the class definition alone.
# test_plotting.py imports plotly directly; plotly has no type stubs.
module = ["tests.test_state", "tests.test_plotting"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
