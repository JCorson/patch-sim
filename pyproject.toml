[project]
name = "patch_sim"
version = "0.1.0"
description = "Patch clamp experiment simulator implementing the Hodgkin-Huxley model for neuronal electrophysiology"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
patch_sim = {path = "./patch_sim", editable = true}

[tool.ty.src]
include = ["./patch_sim", "./patch_sim_ui", "./tests"]

[[tool.ty.overrides]]
include = [
    "patch_sim_ui/**",
    "tests/ui/test_state.py",
    "tests/ui/test_plotting.py",
    "tests/ui/test_traces_api.py",
]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["reflex.**", "plotly.**", "patch_sim_ui.**", "starlette.**"]

# NumPy structured arrays use string-key subscript assignment which ty does not
# model. Suppress the false-positive invalid-assignment errors in files that
# build or read structured arrays.
[[tool.ty.overrides]]
include = [
    "patch_sim/clamp_simulations.py",
    "tests/ui/test_plotting.py",
    "tests/ui/test_state.py",
    "tests/unit/test_burst_metrics.py",
    "tests/unit/test_calcium_transients.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/ui"]
asyncio_mode = "auto"
addopts = "-n auto --dist=loadscope"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*multi-threaded.*fork:DeprecationWarning:multiprocessing",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]
ui = [
    "plotly>=6.7.0",
    "reflex>=0.9.1",
]
